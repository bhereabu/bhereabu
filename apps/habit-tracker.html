<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #0f0f13;
    --panel: #17171d;
    --panel-2: #1d1d25;
    --line: #2a2a35;
    --text: #e8e8ef;
    --muted: #8b8b9c;
    --accent: #6366f1;
    --accent-soft: rgba(99, 102, 241, 0.16);
    --flame: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header { margin-bottom: 28px; }

  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }

  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .today {
    display: inline-block;
    margin-top: 14px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: #a5b4fc;
    font-size: 12px;
    font-weight: 550;
    letter-spacing: 0.01em;
  }

  ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }

  li {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  li.done { border-color: rgba(99, 102, 241, 0.45); background: var(--panel-2); }

  /* Checkbox */
  .box {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    border: 2px solid #3a3a48;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0;
    transition: transform 0.14s cubic-bezier(.34,1.56,.64,1), border-color 0.18s, background 0.18s;
  }

  .box:hover { border-color: var(--accent); transform: scale(1.06); }
  .box:active { transform: scale(0.9); }
  .box:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .box.checked { background: var(--accent); border-color: var(--accent); }

  .box svg { width: 16px; height: 16px; }

  .box svg path {
    fill: none;
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
  }

  .box.checked svg path { animation: draw 0.28s 0.02s ease forwards; }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  .box.pop { animation: pop 0.32s cubic-bezier(.34,1.56,.64,1); }

  @keyframes pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.28); }
    100% { transform: scale(1); }
  }

  .ring {
    position: absolute;
    inset: -6px;
    border-radius: 14px;
    border: 2px solid var(--accent);
    opacity: 0;
    pointer-events: none;
  }

  .box-holder { position: relative; flex: none; display: grid; place-items: center; }

  .box-holder.burst .ring { animation: burst 0.5s ease-out forwards; }

  @keyframes burst {
    0%   { opacity: 0.7; transform: scale(0.75); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  /* Habit body */
  .body { flex: 1; min-width: 0; }

  .name {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    font-weight: 550;
    padding: 3px 6px;
    margin-left: -6px;
    border-radius: 6px;
  }

  .name:hover { background: rgba(255,255,255,0.04); }
  .name:focus { outline: none; background: rgba(255,255,255,0.07); }

  li.done .name { color: #b9bcf5; }

  .week { display: flex; gap: 5px; margin-top: 9px; padding-left: 0; }

  .dot {
    width: 20px; height: 6px;
    border-radius: 3px;
    background: #262633;
  }

  .dot.hit { background: var(--accent); }
  .dot.today-dot { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.22); }

  /* Streak */
  .streak {
    flex: none;
    text-align: right;
    min-width: 68px;
  }

  .streak-n {
    font-size: 21px;
    font-weight: 680;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--muted);
    transition: color 0.2s;
  }

  .streak-n.live { color: var(--flame); }

  .streak-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 1px; }

  .bump { animation: bump 0.36s cubic-bezier(.34,1.56,.64,1); }

  @keyframes bump {
    0%   { transform: translateY(0); }
    40%  { transform: translateY(-6px) scale(1.14); }
    100% { transform: translateY(0); }
  }

  footer {
    margin-top: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    color: var(--muted);
    font-size: 12.5px;
  }

  button.reset {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }

  button.reset:hover { border-color: #40404f; color: var(--text); }

  @media (max-width: 460px) {
    body { padding: 24px 14px 60px; }
    li { padding: 14px; gap: 12px; }
    .streak { min-width: 56px; }
    .dot { width: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Habit Tracker</h1>
    <p class="sub">Five habits. Check them off daily. Miss a day and the streak resets.</p>
    <span class="today" id="todayLabel"></span>
  </header>

  <ul id="list"></ul>

  <footer>
    <span id="summary"></span>
    <button class="reset" id="resetBtn">Reset all data</button>
  </footer>
</div>

<script>
const KEY = 'habit-tracker.v1';
const DEFAULTS = ['Move for 30 minutes', 'Read 10 pages', 'No screens after 10pm', 'Write 200 words', 'Sleep by midnight'];

/* --- date helpers: local-time day keys, so no timezone drift --- */
const dayKey = (d) => {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const shiftDays = (d, n) => {
  const c = new Date(d);
  c.setDate(c.getDate() + n);
  return c;
};
const today = () => dayKey(new Date());

/* --- state --- */
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && Array.isArray(raw.habits) && raw.habits.length) {
      return {
        habits: raw.habits.map((h) => ({
          name: typeof h.name === 'string' ? h.name : 'Habit',
          days: Array.isArray(h.days) ? h.days.filter((x) => typeof x === 'string') : [],
        })),
      };
    }
  } catch (_) { /* corrupt or absent -> defaults */ }
  return { habits: DEFAULTS.map((name) => ({ name, days: [] })) };
}

let state = load();

const save = () => localStorage.setItem(KEY, JSON.stringify(state));

/* A streak counts back from today. Checking today extends it; the streak
   survives until today ends unchecked AND yesterday is unchecked too. */
function streak(days) {
  const set = new Set(days);
  let start = new Date();
  if (!set.has(dayKey(start))) start = shiftDays(start, -1); // today not done yet: count through yesterday
  let n = 0;
  while (set.has(dayKey(start))) {
    n++;
    start = shiftDays(start, -1);
  }
  return n;
}

function lastSevenDays() {
  const out = [];
  for (let i = 6; i >= 0; i--) out.push(dayKey(shiftDays(new Date(), -i)));
  return out;
}

/* --- render --- */
const list = document.getElementById('list');

function render() {
  const t = today();
  const week = lastSevenDays();
  list.innerHTML = '';

  state.habits.forEach((habit, i) => {
    const done = habit.days.includes(t);
    const n = streak(habit.days);

    const li = document.createElement('li');
    li.className = done ? 'done' : '';

    const holder = document.createElement('div');
    holder.className = 'box-holder';

    const ring = document.createElement('span');
    ring.className = 'ring';

    const box = document.createElement('button');
    box.className = 'box' + (done ? ' checked' : '');
    box.type = 'button';
    box.setAttribute('aria-pressed', String(done));
    box.setAttribute('aria-label', `Mark "${habit.name}" done today`);
    box.innerHTML = '<svg viewBox="0 0 20 20"><path d="M4 10.5 L8.2 14.5 L16 6"/></svg>';
    box.addEventListener('click', () => toggle(i, box, holder, li));

    holder.append(ring, box);

    const body = document.createElement('div');
    body.className = 'body';

    const name = document.createElement('input');
    name.className = 'name';
    name.value = habit.name;
    name.setAttribute('aria-label', 'Habit name');
    name.addEventListener('change', () => {
      state.habits[i].name = name.value.trim() || 'Habit';
      save();
      render();
    });
    name.addEventListener('keydown', (e) => { if (e.key === 'Enter') name.blur(); });

    const wk = document.createElement('div');
    wk.className = 'week';
    week.forEach((d) => {
      const dot = document.createElement('span');
      dot.className = 'dot' + (habit.days.includes(d) ? ' hit' : '') + (d === t ? ' today-dot' : '');
      dot.title = d;
      wk.append(dot);
    });

    body.append(name, wk);

    const streakEl = document.createElement('div');
    streakEl.className = 'streak';
    streakEl.innerHTML =
      `<div class="streak-n${n > 0 ? ' live' : ''}">${n}</div>` +
      `<div class="streak-label">day${n === 1 ? '' : 's'}</div>`;

    li.append(holder, body, streakEl);
    list.append(li);
  });

  const doneCount = state.habits.filter((h) => h.days.includes(t)).length;
  document.getElementById('summary').textContent =
    `${doneCount} of ${state.habits.length} done today`;
}

function toggle(i, box, holder, li) {
  const t = today();
  const days = state.habits[i].days;
  const at = days.indexOf(t);

  if (at === -1) {
    days.push(t);
    box.classList.add('checked', 'pop');
    holder.classList.add('burst');
    li.classList.add('done');
    box.setAttribute('aria-pressed', 'true');
    // let the animation play out, then re-render with the new streak
    setTimeout(() => {
      const el = list.children[i]?.querySelector('.streak-n');
      render();
      const fresh = list.children[i]?.querySelector('.streak-n');
      if (fresh && el) fresh.classList.add('bump');
    }, 300);
  } else {
    days.splice(at, 1);
    box.classList.remove('checked');
    li.classList.remove('done');
    box.setAttribute('aria-pressed', 'false');
    render();
  }
  save();
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Delete all habits and history?')) return;
  localStorage.removeItem(KEY);
  state = load();
  render();
});

document.getElementById('todayLabel').textContent =
  new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

render();

// If the tab is left open past midnight, roll the view over.
let renderedDay = today();
setInterval(() => {
  if (today() !== renderedDay) {
    renderedDay = today();
    document.getElementById('todayLabel').textContent =
      new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    render();
  }
}, 30000);
</script>
</body>
</html>
